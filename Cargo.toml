[package]
name = "genome-population-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false

[dependencies]
blake3 = { version = "=1.8.6", default-features = false, features = ["pure"] }
getrandom = { version = "=0.4.3", default-features = false }
jsonschema = { version = "=0.49.9", default-features = false }
noodles-fasta = { version = "=0.66.0", default-features = false }
rand_chacha = { version = "=0.10.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde_json = { version = "=1.0.149", default-features = false, features = ["float_roundtrip", "std"] }
sha2 = { version = "=0.10.9", default-features = false }
toml = { version = "=1.1.4", default-features = false, features = ["parse", "std"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
