name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo gates
    runs-on: ubuntu-24.04
    # Sin información de depuración, las pruebas compiladas ocupan 2,9 GB en
    # vez de 26 GB, y caben en el disco del runner (unos 14 GB libres). Medido
    # el 25/10/2026; la batería da el mismo resultado. Los fallos siguen
    # indicando fichero y línea. La compilación incremental no sirve en una
    # máquina que empieza de cero.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned independent FASTA validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends samtools=1.19.2-1build2
          samtools --version
      # DTC-066 exige bcftools y tabix exactamente 1.24 como jueces externos
      # del VCF; Ubuntu 24.04 no los empaqueta en esa versión. Se compilan desde
      # las fuentes oficiales con la huella fijada, como en el puesto local.
      - name: Install pinned bcftools and tabix 1.24
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends zlib1g-dev libbz2-dev liblzma-dev
          cd "$RUNNER_TEMP"
          curl -sSLf -o htslib-1.24.tar.bz2 https://github.com/samtools/htslib/releases/download/1.24/htslib-1.24.tar.bz2
          curl -sSLf -o bcftools-1.24.tar.bz2 https://github.com/samtools/bcftools/releases/download/1.24/bcftools-1.24.tar.bz2
          echo "28a8de191381c7a97a35675ceac76fa1ea95e7b678d6a2e9d600a7874e4077de  htslib-1.24.tar.bz2" | sha256sum -c -
          echo "8caddc22610ee2851666047c859bb91da0c1e32d0c2ec553db6f153ad130e46f  bcftools-1.24.tar.bz2" | sha256sum -c -
          tar xjf htslib-1.24.tar.bz2
          tar xjf bcftools-1.24.tar.bz2
          (cd htslib-1.24 && ./configure --prefix=/usr/local --disable-libcurl --disable-gcs --disable-s3 && make -j"$(nproc)" && sudo make install)
          (cd bcftools-1.24 && ./configure --prefix=/usr/local --with-htslib=../htslib-1.24 && make -j"$(nproc)" && sudo make install)
          sudo ldconfig
          bcftools --version | head -1
          tabix --version | head -1
      # El validador de esquemas JSON se lanza como proceso externo con el
      # python3 del camino de búsqueda y necesita jsonschema 4.10.3, fijado en
      # uv.lock (CLAUDE.md §7).
      - name: Install pinned Python dependencies
        run: |
          set -euo pipefail
          pipx install uv==0.4.19
          uv sync --frozen --all-groups
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          "$GITHUB_WORKSPACE/.venv/bin/python3" -c "import jsonschema; print('jsonschema', jsonschema.__version__)"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run target tests
        run: cargo test --workspace --all-targets --locked
      - name: Run documentation tests
        run: cargo test --workspace --doc --locked
      - name: Build portable release
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
