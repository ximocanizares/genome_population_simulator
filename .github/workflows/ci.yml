name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cargo:
    name: Cargo gates
    runs-on: ubuntu-24.04
    # Sin información de depuración, las pruebas compiladas ocupan 2,9 GB en
    # vez de 26 GB, y caben en el disco del runner (unos 14 GB libres). Medido
    # el 25/10/2026; la batería da el mismo resultado. Los fallos siguen
    # indicando fichero y línea. La compilación incremental no sirve en una
    # máquina que empieza de cero.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned independent FASTA validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends samtools=1.19.2-1build2
          samtools --version
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run target tests
        run: cargo test --workspace --all-targets --locked
      - name: Run documentation tests
        run: cargo test --workspace --doc --locked
      - name: Build portable release
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
