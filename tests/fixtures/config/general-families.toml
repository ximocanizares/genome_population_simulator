config_kind = "general"
schema_version = "2"
route = "families"

[reference]
kind = "simulated"
id = "ref-main"
default_ploidy = 2
composition = [
  { id = "A", category = "base", value = 1.0 },
  { id = "C", category = "base", value = 0.0 },
  { id = "G", category = "base", value = 0.0 },
  { id = "T", category = "base", value = 0.0 },
]

[[reference.sequences]]
id = "chr1"
class = "chromosome"
length = 1000

[[scenarios]]
id = "families-small"
path = "scenario-families.toml"
route = "families"
