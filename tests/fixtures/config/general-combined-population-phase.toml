config_kind = "general"
schema_version = "1"
route = "direct"

[reference]
kind = "simulated"
id = "ref-main"
default_ploidy = 2
composition = [
  { id = "A", category = "base", value = 1.0 },
  { id = "C", category = "base", value = 0.0 },
  { id = "G", category = "base", value = 0.0 },
  { id = "T", category = "base", value = 0.0 },
]

[[reference.sequences]]
id = "chr1"
class = "chromosome"
length = 1000

[[populations]]
id = "pop-1"

[[phases]]
id = "phase-1"

[[rules]]
id = "selfing-base"
parameter = "selfing_rate"
value = 0.1

[[rules]]
id = "selfing-population"
parameter = "selfing_rate"
value = 0.2
population = "pop-1"

[[rules]]
id = "selfing-phase"
parameter = "selfing_rate"
value = 0.3
phase = "phase-1"

[[rules]]
id = "selfing-combined"
parameter = "selfing_rate"
value = 0.4
population = "pop-1"
phase = "phase-1"
