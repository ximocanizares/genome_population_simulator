# Ejecución A de VE-SNP 0.1: deriva la referencia reducida.
#
# La semilla es trazable, no arbitraria: sha256("VE-SNP-0.1/run-A"). Debe estar
# declarada porque, si falta, el simulador la toma del CSPRNG del sistema y la
# repetición que exige §8.1 del plan dejaría de significar nada.
#
# La geometría (region_size_bases y target_bases) es un parámetro del ensayo por
# VE-D14, no una constante del contrato. target_bases es obligatorio aquí porque
# reduction_percent no da una longitud exacta.

