# VE-D04: mil candidatos A/C/G/T, frecuencia ALT uniforme en [0,1; 0,4).
# Sin separacion minima entre loci: la fusion MNP se resuelve en el
# comparador por VE-D13, no alterando la verdad.
[population_snvs]
mode = "generate"

[population_snvs.generate]
count_mode = "exact"
locus_count = 1000
spatial_mode = "uniform"
substitution_profile = "uniform_snv12_v1"

[[population_snvs.generate.populations]]
population_id = "pop-ve"
frequency_model = "uniform"
min_alt_af = 0.1
max_alt_af = 0.4

[[initial_populations]]
population_id = "pop-ve"
individual_count = 20
ploidy = 2
genotype_model = "hwe"
individual_ids = [
  "ind-01",
  "ind-02",
  "ind-03",
  "ind-04",
  "ind-05",
  "ind-06",
  "ind-07",
  "ind-08",
  "ind-09",
  "ind-10",
  "ind-11",
  "ind-12",
  "ind-13",
  "ind-14",
  "ind-15",
  "ind-16",
  "ind-17",
  "ind-18",
  "ind-19",
  "ind-20",
]

# VE-D02: PE neutro. sequencing_errors disabled produce cero
# sustituciones; quimeras, index hopping y contaminacion quedan a cero.
[technical_event]
event_id = "ve-snp-pe-neutral"
target_coverage_wgs = 30
read_length_bases = 150
sequencing_errors = "disabled"
chimera_rate = 0
index_hopping_rate = 0
contamination_min_percent = 0
contamination_max_percent = 0
individual_ids = [
